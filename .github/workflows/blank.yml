
name: A GURU APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -o *.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17



        - name: Build APK
          run: |
            GRADLEW=$(find project -type f -name gradlew | head -n 1)
            if [ -z "$GRADLEW" ]; then
              echo "gradlew not found"
              exit 1
            fi
            chmod +x "$GRADLEW"
            cd "$(dirname "$GRADLEW")"
            ./gradlew assembleDebug
